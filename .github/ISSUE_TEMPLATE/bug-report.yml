name: 小米 BE7000 MosDNS 故障反馈
description: 报告在小米 BE7000 上遇到的 MosDNS 问题
title: "[BE7000] "
body:
  - type: input
    id: version
    attributes:
      label: MosDNS 版本
      description: 请填写 `mosdns version` 的输出。
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: BE7000 固件版本
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述和复现步骤
      description: 请说明预期结果、实际结果和触发问题的步骤。
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 复现配置
      render: yaml
      description: 可附上能复现问题的最小配置，请先移除凭据。

  - type: textarea
    id: log
    attributes:
      label: 相关 MosDNS 日志
      render: txt
