name: Release Xiaomi BE7000 MosDNS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-zig

      - name: Build Xiaomi BE7000 archive
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive=$(python ./release.py --tag "$RELEASE_TAG")
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
