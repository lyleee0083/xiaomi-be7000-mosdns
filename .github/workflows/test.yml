name: Test Xiaomi BE7000 MosDNS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Test
        run: go test -race -v ./...

      - uses: ./.github/actions/setup-zig

      - name: Build Xiaomi BE7000 archive
        id: package
        run: |
          archive=$(python3 release.py)
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Check the packaged ARM64 version
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-user
          extracted=$(mktemp -d "$RUNNER_TEMP/be7000-mosdns.XXXXXX")
          unzip -q "$ARCHIVE" mosdns -d "$extracted"
          actual=$(qemu-aarch64 "$extracted/mosdns" version)
          expected=$(cat VERSION)
          printf 'MosDNS version: %s\n' "$actual"
          test "$actual" = "$expected"

      - name: Upload Xiaomi BE7000 archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
